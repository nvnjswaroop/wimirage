[project]
name = "wimirage"
version = "1.0.0"
description = "wimirage — a mirage over the airwaves: Wi-Fi deauth & evil-twin framework for authorized penetration testing"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Wimirage Project"}
]
keywords = ["wifi", "pentest", "evil-twin", "deauth", "captive-portal", "80211"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "scapy>=2.5.0,<3.0",
    "flask>=3.0.0,<4.0",
]

[project.optional-dependencies]
encrypt = ["cryptography>=42.0.0,<44.0"]
sms = ["twilio>=8.0.0,<9.0"]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=4.1.0,<6.0",
    "pytest-mock>=3.12.0,<4.0",
    "ruff>=0.3.0,<0.5.0",
    "mypy>=1.9.0,<2.0",
    "types-flask>=1.1.0",
    "types-jinja2>=2.11.0",
]
all = [
    "wimirage[sms,encrypt,dev]",
]

[project.urls]
Repository = "https://example.invalid/wimirage"  # placeholder — set real URL when published
Documentation = "https://example.invalid/wimirage/docs"
Issues = "https://example.invalid/wimirage/issues"

[project.scripts]
wifi-eviltwin = "main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["core", "utils"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true

# Mirrors the --cov-fail-under=80 in .github/workflows/test.yml — keep these
# in sync so a local `pytest --cov` build fails on the same threshold as CI.
fail_under = 80

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "N802",  # function name should be lowercase (legacy code)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "utils", "portal"]
combine-as-imports = true

[tool.mypy]
# Section 6 #1 — match the ``requires-python = \">=3.10\"`` floor in
# ``[project]``. Pinning 3.8 here was leftover from a pre-2.0 baseline;
# the codebase uses ``X | None`` PEP-604 unions, structural pattern
# matching, and ``secrets.token_hex(32)`` — all 3.10+ features.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true